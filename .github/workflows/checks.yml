name: Checks

# Reusable checks, called by ci.yml (feature branches, pull requests).
# They do not run on their own.
on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  # Gate: the repo has no Go code yet (see README milestone 0). Every job below
  # is skipped, not failed, until go.mod and at least one .go file exist.
  # Once the module is scaffolded, delete this job and the `needs`/`if` lines.
  detect:
    name: Detect Go code
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.detect.outputs.has_go }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f go.mod ] && [ -n "$(find . -name '*.go' -not -path './.git/*' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod or .go files yet; Go jobs are skipped."
          fi

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # No .golangci.yml: the v2 default linters are errcheck, govet,
      # ineffassign, staticcheck and unused. staticcheck is covered here.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  quality:
    name: Code quality
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

  test:
    name: Unit tests (coverage >= 90%)
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN: '90'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          echo "Total statement coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          echo "Total statement coverage: **${total}%** (minimum ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t + 0 >= m + 0) }'; then
            echo "::error::Coverage ${total}% is below the ${COVERAGE_MIN}% minimum."
            exit 1
          fi
