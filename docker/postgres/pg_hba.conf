# Local development only. Same rules as the postgres image default, plus one line
# that lets other containers open replication connections (pg_basebackup and
# streaming replication from the replica). Used by docker-compose.replica.yaml.
#
# "host all" does not match replication connections, so the last line is needed.

local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
